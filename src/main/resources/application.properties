# ==============================
# Conexion a Oracle - DBA_COMPRAS
# ==============================
# IMPORTANTE: no subir este archivo con credenciales reales a un repo publico.
# Idealmente mover usuario/clave a variables de entorno antes de entregar/publicar.

spring.datasource.url=jdbc:oracle:thin:@//52.171.58.51:1521/FREEPDB1
spring.datasource.username=DBA_COMPRAS
spring.datasource.password=DBA_COMPRAS
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# El esquema/usuario DBA_COMPRAS ya es el dueno de las tablas, no hace falta prefijo
spring.jpa.properties.hibernate.default_schema=DBA_COMPRAS

# Puerto del servidor (ajustar si choca con otro grupo trabajando en la misma maquina)
server.port=8080

# Nombre de la app (util para logs)
spring.application.name=dba-compras-api
