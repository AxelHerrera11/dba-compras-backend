# ==============================
# Conexion a Oracle - DBA_COMPRAS
# ==============================
# Usa variables de entorno con valor por defecto: en local no hay que
# configurar nada (sigue usando los mismos valores de siempre), pero en
# Render (u otro hosting) se sobreescriben con las variables de entorno
# reales sin tocar este archivo ni exponer credenciales en el repo.

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//52.171.58.51:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:DBA_COMPRAS}
spring.datasource.password=${DB_PASSWORD:DBA_COMPRAS}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=DBA_COMPRAS

# Puerto: Render lo inyecta via la variable PORT (ver Dockerfile), en local usa 8080
server.port=${PORT:8080}

spring.application.name=dba-compras-api